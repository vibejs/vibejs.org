    <title>vibe.js: if it compiles, both sides agree</title>
    <meta
      name="description"
      content="vibe.js (@usevibejs, CLI vibejs) is a full-stack TypeScript framework: .vibe components, a modular server and typed contracts — not monday.com Vibe."
    />
    <link rel="canonical" href="https://vibejs.org/" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Applies the saved or system theme before the first paint, so the page never flashes.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch {}
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name=theme-color]').content = dark ? '#0a0a0a' : '#ffffff';
      })();
    </script>
